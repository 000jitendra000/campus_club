{% extends "base.html" %}

{% block title %}Edit Question — Campus Club{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">
                <i class="bi bi-pencil me-2 text-primary"></i>Edit Question
            </h1>
            <a href="{% url 'form_builder' event.pk %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back to Form
            </a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-4">
                <form method="post" novalidate id="question-edit-form">
                    {% csrf_token %}
                    {% include "events/_form_fields.html" %}
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>Save Changes
                        </button>
                        <a href="{% url 'form_builder' event.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
